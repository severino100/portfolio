<div class="page-grid" aria-hidden="true">
  @for (col of gridCols; track $index) {
    <div class="page-grid__col"></div>
  }
</div>

<div class="page-mask" [class.is-loaded]="loaded()">
  <div class="boot mono small" aria-hidden="true">
    @for (line of typedLines(); track $index; let last = $last) {
      <div class="boot__line">{{ line }}@if (last && !bootDone()) {<span class="boot__cursor"></span>}</div>
    }
  </div>
</div>

<app-cursor />
<app-nav />

<aside class="rail" aria-hidden="true">
  @for (s of railSections; track s.id) {
    <a class="rail__dot" [href]="'#' + s.id" [class.is-active]="activeSection() === s.id">
      <span class="rail__num mono">{{ s.num }}</span>
    </a>
  }
</aside>

<main class="page">
  <div class="page__section" id="hero">
    <app-hero />
  </div>

  <div class="page__section reveal-section" id="about">
    <app-about />
  </div>

  <div class="page__section reveal-section" id="work">
    <app-work />
  </div>

  <div class="page__section reveal-section" id="projects">
    <app-projects />
  </div>

  <div class="interlude reveal-section">
    <p class="mono small interlude__pre">{{ i18n.t().interlude.pre }}</p>
    <p class="display italic interlude__text" [innerHTML]="i18n.t().interlude.quote"></p>
    <p class="mono small interlude__sig">{{ i18n.t().interlude.sig }}</p>
  </div>

  <div class="page__section reveal-section" id="life">
    <app-life />
  </div>

  <div class="page__section reveal-section" id="skills">
    <app-skills />
  </div>

  <div class="page__section" id="contact">
    <app-footer />
  </div>
</main>

<div class="section-nav">
  <button class="section-nav__btn" (click)="goToSection(-1)" [disabled]="isFirstSection()" aria-label="Previous section">
    <span>↑</span>
  </button>
  <button class="section-nav__btn" (click)="goToSection(1)" [disabled]="isLastSection()" aria-label="Next section">
    <span>↓</span>
  </button>
</div>
