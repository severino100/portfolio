<footer class="foot">
  <div class="foot__pretitle mono small">{{ i18n.t().foot.pre }}</div>
  <div class="foot__grid">
    <span class="display foot__big italic">{{ i18n.t().foot.big }}</span>
    <div class="foot__contact">
      <a #mailBtn class="foot__mail" href="mailto:rubenfranciscos@gmail.com"
         [style.transform]="'translate(' + tr().x + 'px, ' + tr().y + 'px)'"
         style="transition: transform 350ms cubic-bezier(0.2,0.7,0.2,1); display:inline-block">
        rubenfranciscos&#64;gmail.com
      </a>
      <span class="mono small foot__phone">+351 927 896 270</span>
      <a class="mono small foot__link" href="https://www.linkedin.com/in/ruben-severino" target="_blank" rel="noreferrer">linkedin.com/in/ruben-severino ↗</a>
    </div>
  </div>
  <div class="foot__meta">
    @for (m of i18n.t().foot.meta; track m) {
      <span class="mono small">{{ m }}</span>
    }
  </div>
</footer>
